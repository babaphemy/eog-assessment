name: Run Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e . # Assumes pyproject.toml is in repo root

      - name: Run test-cart
        run: uv run pytest py/tests/unit/test_cart_service_fixed.py

      - name: Run test-price
        run: uv run pytest py/tests/unit/test_price_c.py
