name: Run Unit Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run test-cart
        run: uv run pytest tests/unit/test_cart_service.py

      - name: Run test-price
        run: uv run pytest tests/unit/test_price_compare.py
